<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mag 趋势图表量化终端 v2</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg:      #0d1520;
    --panel:   #111e30;
    --border:  #1e3352;
    --otc:     #38c8ff;
    --blast:   #00e8b0;
    --orange:  #ff9f1c;
    --yellow:  #f5e642;
    --red:     #ff3d5a;
    --text:    #c8daf0;
    --dim:     #4a6080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .brand span { color: var(--otc); }
  .date-range {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--otc);
  }
  .date-range input[type=date] {
    background: transparent;
    border: none;
    color: var(--otc);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    width: 120px;
  }
  .date-range input[type=date]::-webkit-calendar-picker-indicator {
    filter: invert(0.6) sepia(1) saturate(3) hue-rotate(170deg);
    cursor: pointer;
  }
  .date-sep { color: var(--dim); }
  .asset-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    min-width: 180px;
  }
  .asset-wrap select {
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    width: 100%;
  }
.asset-wrap select option{
    background:#111e30;
}

.asset-wrap select optgroup{
    background:#111e30;
    color:#ffffff;
    font-weight:700;
}
.asset-wrap select,
.asset-wrap select option,
.asset-wrap select optgroup{
color:#fff !important;
}
.toggles{
display:flex;
align-items:center;
gap:12px;
margin-left:auto;
}

.zoomBtns{
display:flex;
gap:8px;
margin-right:18px;
}

.zoomBtns button{

background:#111e30;
border:1px solid #1e3352;
color:#4a6080;

padding:6px 12px;

border-radius:6px;

font-size:12px;

cursor:pointer;

font-family:'Share Tech Mono';

transition:.2s;

}

.zoomBtns button:hover{

border-color:#38c8ff;
color:#38c8ff;

}

.toggle-btn{

display:flex;
align-items:center;
gap:8px;

padding:8px 18px;

border-radius:22px;

border:1.5px solid #4a6080;

background:transparent;

font-size:15px;

font-weight:700;

cursor:pointer;

transition:.25s;

}

.toggle-btn .dot{

width:10px;
height:10px;

border-radius:50%;

background:#4a6080;

}

.toggle-btn.on-otc{

border-color:#38c8ff;
color:#38c8ff;

box-shadow:
0 0 12px rgba(56,200,255,.2);

}

.toggle-btn.on-otc .dot{

background:#38c8ff;

box-shadow:
0 0 10px rgba(56,200,255,.7);

}


.toggle-btn.on-blast{

border-color:#00e8b0;
color:#00e8b0;

box-shadow:
0 0 12px rgba(0,232,176,.2);

}

.toggle-btn.on-blast .dot{

background:#00e8b0;

box-shadow:
0 0 10px rgba(0,232,176,.7);

}

.toggle-btn .check{

font-size:16px;

opacity:1;

transition:.2s;

}

#btnOtc:not(.on-otc) .check{

opacity:0;

}

#btnBlast:not(.on-blast) .check{

opacity:0;

}   .statsbar {
    display: flex;
    gap: 0;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .stat {
    padding: 10px 22px 10px 0;
    margin-right: 22px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .stat:last-child { border-right: none; }
  .stat-label { font-size: 11px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }
  .stat-val { font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 700; margin-top: 2px; }
  .c-otc   { color: var(--otc);    }
  .c-blast { color: var(--blast);  }
  .c-in    { color: #00e8b0;       }
  .c-out   { color: var(--red);    }
  .c-near  { color: var(--orange); }
  #chart { width: 100%; height: calc(100vh - 160px); min-height: 520px; }
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999; gap: 18px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--otc);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-family: 'Share Tech Mono', monospace; color: var(--otc); font-size: 13px; letter-spacing: 2px; }
  #err {
    display: none;
    background: #2a0a10; border: 1px solid var(--red);
    border-radius: 8px; padding: 12px 20px;
    margin: 16px 28px; color: var(--red); font-size: 14px;
  }/* 新增这里 */

.phaseLegend{

display:flex;

justify-content:flex-end;

gap:40px;

padding:12px 60px;

color:#9ca9bc;

font-size:16px;

font-weight:600;

}

.legendItem{

display:flex;

align-items:center;

gap:10px;

}

.solidLine{

width:48px;

height:4px;

background:#fff;

border-radius:10px;

}

.dashLine{

width:48px;

border-top:4px dashed #fff;

}
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.zoomBtns button:active{

transform:scale(.96);

border-color:#38c8ff;

color:#38c8ff;

}

.toggle-btn:active{

transform:scale(.97);

}
</style>

<body>

<div id="loading"><div class="spinner"></div><p>LOADING DATA...</p></div>
<div id="err"></div>

<div class="header">
  <div class="brand">MAG <span>趋势</span> 终端</div>
  <div class="date-range">
    <input type="date" id="dateFrom" value="2020-09-01">
    <span class="date-sep">→</span>
    <input type="date" id="dateTo"   value="2026-12-31">
  </div>
  <div class="asset-wrap">
    <select id="assetSel"></select>
  </div>
<div class="toggles">

<button
class="toggle-btn on-otc"
id="btnOtc"
onclick="toggle('otc')">

<span class="check">✓</span>
<span class="dot"></span>
场外指数

</button>


<button
class="toggle-btn on-blast"
id="btnBlast"
onclick="toggle('blast')">

<span class="check">✓</span>
<span class="dot"></span>

爆破指数

</button>

<div style="flex:1"></div>

<div class="zoomBtns">

<button onclick="zoomAll()">ALL</button>
<button onclick="zoomDays(365)">1Y</button>
<button onclick="zoomDays(90)">90D</button>

<button onclick="zoomDays(7)">7D</button>
</div>

</div></div>

<div class="statsbar">
  <div class="stat"><div class="stat-label">最新场外</div><div class="stat-val c-otc"   id="s-otc">--</div></div>
  <div class="stat"><div class="stat-label">最新爆破</div><div class="stat-val c-blast" id="s-blast">--</div></div>
  <div class="stat"><div class="stat-label">当前状态</div><div class="stat-val"         id="s-phase">--</div></div>
  <div class="stat"><div class="stat-label">持续天数</div><div class="stat-val"         id="s-day">--</div></div>
  <div class="stat"><div class="stat-label">逼近警告</div><div class="stat-val"         id="s-near">--</div></div>
  <div class="stat"><div class="stat-label">数据点数</div><div class="stat-val"         id="s-cnt" style="color:#fff">--</div></div>
<div class="stat">
    <div class="stat-label">周期质量</div>
    <div class="stat-val" id="s-quality">--</div>
</div>

</div>

<div class="phaseLegend">

<div class="legendItem">
<div class="solidLine"></div>
实线/实心点：进场期
</div>

<div class="legendItem">
<div class="dashLine"></div>
虚线/空心点：退场期
</div>

</div>

<div id="chart"></div>

<script>
/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR86SHJh-fNfCDEGfYZAGd_ZGnpnNzy60MQdLBKH5xc1poZjyh9rMYdzSCbfhLNM4rgLR2wOvfGPOoQ/pub?output=csv";

const C = {
  bg:     "#0d1520",
  otc:    "#38c8ff",
  blast:  "#00e8b0",
  orange: "#ff9f1c",
  yellow: "#f5e642",
  red:    "#ff3d5a",
  dim:    "#4a6080"
};

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let allData  = [];
let dataMap  = {};

let chart    = null;

let showOtc  = true;
let showBlast= true;

/* ═══════════════════════════════════════════════
   CSV PARSER
═══════════════════════════════════════════════ */
function parseCSV(text){

const rows=[]

const lines=text.trim().split('\n')

const headers=lines[0]
.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
.map(x=>x.replace(/"/g,'').trim().toLowerCase())

for(let i=1;i<lines.length;i++){

const cols=
lines[i]
.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
?.map(x=>x.replace(/"/g,''))

if(!cols)continue

const row={}

headers.forEach((h,j)=>{

row[h]=cols[j]||""

})

rows.push(row)

}

return rows.filter(r=>r.date&&r.symbol)

}

/* ═══════════════════════════════════════════════
   LOAD SHEET  (tries CORS proxies)
═══════════════════════════════════════════════ */
async function loadSheet() {
  const urls = [
    SHEET_URL,
    `https://corsproxy.io/?${encodeURIComponent(SHEET_URL)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(SHEET_URL)}`
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache:"no-cache" });
      if (r.ok) { allData = parseCSV(await r.text()); return; }
    } catch(_) {}
  }
  throw new Error("无法读取 Google Sheet，已加载演示数据。请把 Sheet 权限设为「知道链接的人可以查看」后刷新。");
}

/* ═══════════════════════════════════════════════
   ASSET SELECT
═══════════════════════════════════════════════ */
function buildSelect() {
  const ORDER = ["CRYPTO","STOCK","COMMODITY"];
  const groups = {};
  allData.forEach(r => {
    const g = r.group || "OTHER";
    if (!groups[g]) groups[g] = new Set();
    groups[g].add(r.symbol);
  });
  const sel = document.getElementById("assetSel");
  sel.innerHTML = "";
  [...ORDER, ...Object.keys(groups).filter(g => !ORDER.includes(g))].forEach(g => {
    if (!groups[g]) return;
    const og = document.createElement("optgroup");
    og.label = g;
    [...groups[g]].sort().forEach(s => {
      const o = document.createElement("option");
      o.value = o.textContent = s;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if ([...sel.options].some(o => o.value === "BTC")) sel.value = "BTC";
}

/* ═══════════════════════════════════════════════
   FILTER
═══════════════════════════════════════════════ */
function getRows(){

const sym=
document.getElementById(
"assetSel"
).value

const from=
document.getElementById(
"dateFrom"
).value

const to=
document.getElementById(
"dateTo"
).value


return (dataMap[sym]||[])

.filter(r=>

(!from||r.date>=from)

&&

(!to||r.date<=to)

)

.sort(

(a,b)=>

a.date.localeCompare(
b.date
)

)

}

/* ═══════════════════════════════════════════════
   FIX 1: X-axis keeps FULL date (YYYY-MM-DD)
   Display label shows YY-MM-DD to save space
   but the underlying value is always the full date,
   so cross-year data never collides.
═══════════════════════════════════════════════ */
function fmtXLabel(dateStr) {
  // "2026-05-19" → "26-05-19"  (keeps year, saves space)
  return dateStr ? dateStr.slice(2) : dateStr;
}

/* ═══════════════════════════════════════════════
   FIX 2: Reference lines use markLine on a
   dedicated invisible scatter, NOT a data-series.
   This means they are completely unaffected by
   toggle(), series re-renders, or Y-axis rescaling.
═══════════════════════════════════════════════ */
function refLineSeries(){

return [

{
id:"ref_otc",
type:"scatter",
yAxisIndex:0,
symbol:"none",
silent:true,
data:[],

markLine:{
silent:true,
symbol:["none","none"],
animation:false,

label:{show:false},

data:[

{
yAxis:1000,
lineStyle:{
color:C.orange,
type:"dashed",
width:1,
opacity:.75
}
},

{
yAxis:0,
lineStyle:{
color:C.yellow,
type:"dashed",
width:1,
opacity:.75
}
}

]

}

},

{

id:"ref_blast",

type:"scatter",

yAxisIndex:1,

symbol:"none",

silent:true,

data:[],

markLine:{

silent:true,

symbol:["none","none"],

animation:false,

label:{show:false},

data:[

{

yAxis:200,

lineStyle:{
color:C.orange,
type:"dashed",
width:1,
opacity:.75
}

},

{

yAxis:0,

lineStyle:{
color:C.yellow,
type:"dashed",
width:1,
opacity:.75
}

}

]

}

}

]

}  
/* ═══════════════════════════════════════════════
   FIX 3: Each series gets a STABLE unique id.
   We destroy and re-create with notMerge=true
   so there is ZERO stale-id residue between renders.
═══════════════════════════════════════════════ */
function buildDataSeries(rows) {
  const phase = rows.map(r => (r.phase||"").toUpperCase());
  const near  = rows.map(r => r.near==="TRUE"||r.near==="true"||r.near==="1");
  const otcV  = rows.map(r => r.otc   !== "" ? +r.otc   : null);
  const blstV = rows.map(r => r.blast !== "" ? +r.blast : null);
  const series = [];

  /* --- draw segment-by-segment lines --- */
  function segs(vals, color, yIdx, pfx) {
    if (!vals.some(v => v !== null)) return;
    for (let i = 1; i < vals.length; i++) {
      if (vals[i] === null || vals[i-1] === null) continue;
      const dash = phase[i]==="OUT" || phase[i-1]==="OUT";
series.push({

id:`${pfx}_L${i}`,

type:"line",

yAxisIndex:yIdx,

silent:true,

symbol:"none",

z:1,
zlevel:1,

clip:true,

lineStyle:{
width:3,
color,
type:dash?"dashed":"solid"
},

data:[
[i-1,vals[i-1]],
[i,vals[i]]
]

});

    }
  }

  /* --- FIX 4: near-points get a glowing ring symbol --- */
  function pts(vals, color, yIdx, pfx) {
    if (!vals.some(v => v !== null)) return;
    series.push({
      id:   `${pfx}_P`,
      type: "scatter",
      yAxisIndex: yIdx,
z:999,
zlevel:999,
      data: vals.map((v, i) => {
        if (v === null) return null;
        const isNear = near[i];
return {

value:[i,v],

// 点大小
symbolSize:isNear?20:14,

symbol:isNear
?"diamond"
:"circle",

itemStyle:{

// OUT空心 IN实心
color:
phase[i]==="OUT"
?"rgba(13,21,32,1)"      // 背景纯不透明
:`${color}`,

opacity:1,

borderColor:isNear
?C.orange
:color,

borderWidth:isNear?4:3,

shadowBlur:isNear?8:0,

shadowColor:isNear
?C.orange
:"transparent"

},
emphasis:{
scale:false,

itemStyle:{
opacity:1
}

}

};      }).filter(Boolean)
    });
  }

  if (showOtc)   { segs(otcV,  C.otc,   0, "otc");   pts(otcV,  C.otc,   0, "otc");  }
  if (showBlast) { segs(blstV, C.blast, 1, "blt");   pts(blstV, C.blast, 1, "blt"); }

if(series.length===0){

series.push({

id:"empty",

type:"line",

silent:true,

symbol:"none",

data:[]

})

}

return{
otcV,
blstV,
phase,
near,
series
};
}

/* ═════════════════════════════════════
   QUALITY
════════════════════════════════════ */
/* ═════════════════════════════════════
   QUALITY — 多周期分析
   返回 cycles[] 数组，每个 cycle 包含:
   { startIdx, endIdx, phase, grade, reason }
════════════════════════════════════ */
function calcAllCycles(rows){
  const cycles = [];
  if (!rows.length) return cycles;

  const ph  = r => (r.phase||"").toUpperCase();
  const otc = r => +r.otc   || 0;
  const bst = r => r.blast !== "" ? +r.blast : null;

  /* ── Step 1: 切分所有周期段 ── */
  // 每当 day===1 就开启一个新周期，end 为下一个 day===1 的前一个索引（或末尾）
  const starts = [];
  rows.forEach((r,i) => {
    if (+r.day === 1) starts.push(i);
  });

  for (let s = 0; s < starts.length; s++) {
    const startIdx = starts[s];
    const endIdx   = (s+1 < starts.length) ? starts[s+1] - 1 : rows.length - 1;
    const cycleRows = rows.slice(startIdx, endIdx + 1);
    const phase     = ph(cycleRows[0]);

    const result = analyzeCycle(cycleRows, phase, rows, startIdx);
    cycles.push({
      startIdx, endIdx, phase,
      grade:  result.grade,
      reason: result.reason
    });
  }

  return cycles;

  /* ── 内部函数：分析单个周期 ── */
  function analyzeCycle(cycleRows, phase, allRows, startIdx) {
    const day1 = cycleRows[0];

    /* ───── 进场期 ───── */
    if (phase === "IN") {
      const otc0   = otc(day1);
      const blast0 = bst(day1) ?? 0;

      // ① 先爆破后进场
      if (blast0 > 200) {
        return { grade:"🔴劣质进场", reason:"先爆破后进场" };
      }

      // ② 一周不破200法则
      const weekRows = cycleRows.filter(r => +r.day >= 1 && +r.day <= 7);
      if (weekRows.length >= 3) {
        const over200 = weekRows.some(r => (bst(r) ?? 0) > 200);
        if (!over200) {
          const avg = weekRows.reduce((s,r) => s + (bst(r) ?? 0), 0) / weekRows.length;
          if (avg <= blast0) {
            return { grade:"🔴劣质进场", reason:"一周未破200且动能不增" };
          }
        }
      }

      // ③ 关键节点法：爆破从 >200 回落至 ≤200 的场外序列
      const nodes = [otc0];
      for (let i = 1; i < cycleRows.length; i++) {
        const prev = bst(cycleRows[i-1]) ?? 0;
        const curr = bst(cycleRows[i])   ?? 0;
        if (prev > 200 && curr <= 200) {
          nodes.push(otc(cycleRows[i]));
        }
      }

      if (nodes.length >= 2) {
        let up = 0;
        for (let i = 1; i < nodes.length; i++) {
          if (nodes[i] > nodes[i-1]) up++;
        }
        const total = nodes.length - 1;
        if (up === total) return { grade:"🟢优质进场", reason:`节点持续抬升 ${up}/${total}` };
        if (up === 0)     return { grade:"🔴劣质进场", reason:"拉盘动力持续减弱" };
        return { grade:"🟡普通进场", reason:`节点涨跌混合 ${up}/${total}` };
      }

      // 节点不足，但已知不是"先爆破"也不是"一周不破"，且周期已经结束
      // 如果周期完整结束（后面还有别的周期）才下定论；否则进行中
      const isCompleted = (startIdx + cycleRows.length) < allRows.length;
      return {
        grade: isCompleted ? "🟡普通进场" : "🟡普通",
        reason: isCompleted ? "节点不足判断" : "进行中待观察"
      };
    }

    /* ───── 退场期 ───── */
    if (phase === "OUT") {
      const otc0 = otc(day1);

      // 在全局 allRows 中找退场D1之前最近的"爆破负→正"节点
      let nodeOtc = null;
      for (let i = startIdx - 1; i > 0; i--) {
        const prev = bst(allRows[i-1]) ?? 0;
        const curr = bst(allRows[i])   ?? 0;
        if (prev < 0 && curr > 0) {
          nodeOtc = otc(allRows[i]);
          break;
        }
      }

      if (nodeOtc !== null) {
        if (otc0 < nodeOtc) {
          return { grade:"🟢优质退场", reason:`场外下降 ${nodeOtc}→${otc0}` };
        }
        return { grade:"🔴劣质退场", reason:`场外不降反升 ${nodeOtc}→${otc0}` };
      }

      const isCompleted = (startIdx + cycleRows.length) < allRows.length;
      return {
        grade: isCompleted ? "🟡普通退场" : "🟡普通",
        reason: isCompleted ? "无法找到负→正节点" : "进行中待观察"
      };
    }

    return { grade:"🟡普通", reason:"未知阶段" };
  }
}

/* 保留旧接口给 statsbar 用：取最后一个周期的质量 */
function calcQuality(rows){
  const cycles = calcAllCycles(rows);
  if (!cycles.length) return { grade:"🟡普通", reason:"" };
  return cycles[cycles.length - 1];
}function render() {
  const rows = getRows();
// ─── 计算双轴锁定范围（5:1 比例，0点对齐） ───
  const otcVals   = rows.map(r => r.otc   !== "" ? +r.otc   : null).filter(v => v !== null);
  const blastVals = rows.map(r => r.blast !== "" ? +r.blast : null).filter(v => v !== null);
  // 把爆破值×5 折算成场外尺度，统一在场外坐标系里求min/max
  const allInOtcScale = [
    ...otcVals,
    ...blastVals.map(v => v * 5)
  ];
  const dataMin = allInOtcScale.length ? Math.min(...allInOtcScale) : -350;
  const dataMax = allInOtcScale.length ? Math.max(...allInOtcScale) :  2150;
  // 向500对齐 + 留一格padding，并保证不小于默认范围
  const leftMin  = Math.min(-350, Math.floor(dataMin / 500) * 500 - 500);
  const leftMax  = Math.max(2150, Math.ceil (dataMax / 500) * 500 + 500);
  const rightMin = leftMin / 5;   // 锁定 5:1
  const rightMax = leftMax / 5;
  updateStats(rows);
  if (!rows.length) { chart.clear(); return; }

  const dates = rows.map(r => r.date);          // full YYYY-MM-DD kept
  const { otcV, blstV, phase, near, series } = buildDataSeries(rows);
/* ===== Good / Bad / Normal 多周期标签（顶部锚定 + 虚线引导） ===== */

const cycles = calcAllCycles(rows);
let qualityMark = [];

cycles.forEach((cyc, idx) => {
  let txt, bgColor, fontColor;
  if (cyc.grade.includes("优质")) {
    txt = "GOOD";    bgColor = "#22c55e"; fontColor = "#ffffff";
  } else if (cyc.grade.includes("普通")) {
    txt = "NORMAL";  bgColor = "#eab308"; fontColor = "#1a1a1a";
  } else {
    txt = "BAD";     bgColor = "#ef4444"; fontColor = "#ffffff";
  }

  const i    = cyc.startIdx;
  const isIn = cyc.phase === "IN";
  // 标签锚定在图表顶部/底部固定位置（leftMax/leftMin 在 render 顶部已计算）
  const yPos = isIn ? leftMax - 100 : leftMin + 100;
  // 数据点的实际 y 值（用于引导线终点）
  const yDataPoint = rows[i].otc !== "" ? +rows[i].otc : yPos;

  qualityMark.push({
    id: "qmark_" + idx,
    type: "scatter",
    yAxisIndex: 0,
    z: 9999,
    symbol: "rect",
    symbolSize: [54, 20],
    data: [[i, yPos]],
    label: {
      show: true,
      formatter: txt,
      color: fontColor,
      fontSize: 11,
      fontWeight: "bold",
      fontFamily: "'Share Tech Mono', monospace"
    },
    itemStyle: {
      color: bgColor,
      borderColor: bgColor,
      borderWidth: 1,
      shadowBlur: 8,
      shadowColor: bgColor + "aa"
    },
    // 从标签到数据点的虚线引导
    markLine: {
      silent: true,
      symbol: ["none", "circle"],
      symbolSize: 6,
      animation: false,
      data: [[
        { coord: [i, yPos], lineStyle: { color: bgColor, type: "dashed", width: 1, opacity: 0.5 } },
        { coord: [i, yDataPoint] }
      ]],
      label: { show: false }
    },
    tooltip: {
      formatter: () => {
        const sd = rows[cyc.startIdx]?.date || "";
        const ed = rows[cyc.endIdx]?.date   || "";
        return `<b style="color:${bgColor}">${cyc.grade}</b><br/>
                <span style="color:#888;font-size:11px">${sd} ~ ${ed}</span><br/>
                <span style="color:#aaa">${cyc.reason}</span>`;
      }
    }
  });
});  /* tooltip formatter */

function updateStats(rows) {
const clear = () =>
[
"s-otc",
"s-blast",
"s-phase",
"s-day",
"s-near",
"s-cnt",
"s-quality"
]

  if (!rows.length) { clear(); return; }
  const l = rows[rows.length-1];
  document.getElementById("s-otc").textContent   = l.otc   || "--";
  document.getElementById("s-blast").textContent = l.blast !== "" ? l.blast : "N/A";
  const pe = document.getElementById("s-phase");
const isIn=

String(
l.phase
).toUpperCase()

.includes(
"IN"
)

pe.textContent=
isIn
?
"进场期"
:
"退场期"

pe.className=
"stat-val "+

(
isIn
?
"c-in"
:
"c-out"
);
  const sym=document.getElementById("assetSel").value;

document.getElementById("s-day").textContent=
(sym==="地产" && isIn)
?(l.day||"--")+" 月"
:(l.day||"--")+" 天";
  const isNear = l.near==="TRUE"||l.near==="true"||l.near==="1";
  const ne = document.getElementById("s-near");
  ne.textContent = isNear ? "⚠ 逼近" : "正常";
  ne.className   = "stat-val "+(isNear?"c-near":"");
  document.getElementById("s-cnt").textContent   = rows.length+" 天";const q=
calcQuality(rows);

document
.getElementById(
"s-quality"
)

.innerHTML=

q.grade;
}
